<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3310 — Underwater Palace</title>
<link rel="preload" as="image" href="phone.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lcd-bg:#9bc9a0;
    --lcd-bg2:#86b98d;
    --lcd-ink:#1b2a1d;
    --lcd-ghost:rgba(27,42,29,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#08090b;overflow:hidden;
    font-family:'Silkscreen',ui-monospace,monospace;}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(60% 45% at 50% 40%,#16222a 0%,rgba(8,9,11,0) 70%),
      linear-gradient(#08090b,#050607);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  /* Photo is padded: 490 x 1060 (phone itself 430 x 1000 + 30px margin) */
  .stage{
    position:relative;
    height:min(calc(100vh - 58px),calc((100vw - 8px) * 1060 / 490));
    aspect-ratio:490/1060;
  }
  @supports (height:1dvh){
    .stage{height:min(calc(100dvh - 58px),calc((100vw - 8px) * 1060 / 490));}
  }
  .stage{opacity:0;transition:opacity .25s}
  .stage.ready{opacity:1}
  .phone{position:absolute;inset:0;width:100%;height:100%;display:block;
    filter:drop-shadow(0 24px 32px rgba(0,0,0,.75)) drop-shadow(0 0 40px rgba(110,200,140,.08));
    pointer-events:none;}

  /* LCD */
  .lcd{
    position:absolute;
    border-radius:2.2% / 3.2%;
    background-color:var(--lcd-bg);
    background-image:linear-gradient(180deg,var(--lcd-bg2) 0%,var(--lcd-bg) 38%,var(--lcd-bg) 100%);
    overflow:hidden;
    box-shadow:inset 0 .9vh 1.2vh rgba(10,30,15,.45), inset 0 0 0 1px rgba(20,40,25,.35);
    color:var(--lcd-ink);
    container-type:size;
  }
  .lcd::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,rgba(20,40,25,.07) 0 1px,transparent 1px 3px),
      repeating-linear-gradient(90deg,rgba(20,40,25,.06) 0 1px,transparent 1px 3px),
      linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 40%);
  }
  .px{position:absolute;color:var(--lcd-ink);text-shadow:1.5px 1.5px 0 var(--lcd-ghost);line-height:1;white-space:nowrap;left:0;right:0;text-align:center;font-weight:700}
  .title{top:6%;font-size:12cqh;letter-spacing:.14em}
  .modeName{bottom:5%;font-size:12cqh;letter-spacing:.08em}
  #emo{
    position:absolute;left:50%;top:22%;height:50.8%;aspect-ratio:48/30;transform:translateX(-50%);
    image-rendering:pixelated;image-rendering:crisp-edges;
    filter:drop-shadow(1.5px 1.5px 0 var(--lcd-ghost));
  }

  .bars{position:absolute;top:9%;display:flex;flex-direction:column;gap:2.2cqh}
  .bars.l{left:3.5%}
  .bars.r{right:3.5%;align-items:flex-end}
  .bars b{display:block;height:4.2cqh;width:3.6cqw;background:var(--lcd-ink);box-shadow:1.5px 1.5px 0 var(--lcd-ghost)}
  .bars b.off{background:var(--lcd-ghost);box-shadow:none}

  .lcd > *{transition:opacity .18s steps(3)}
  .lcd.off{background-image:none;background-color:#6d8571;box-shadow:inset 0 .9vh 1.2vh rgba(10,25,12,.55), inset 0 0 0 1px rgba(20,40,25,.35)}
  .lcd{transition:background-color .35s}
  .lcd.off > *{opacity:0}
  .flash{animation:flash .22s steps(2) 1}
  @keyframes flash{0%{opacity:.15}50%{opacity:1}100%{opacity:1}}

  /* Keys */
  .key{
    position:absolute;
    transform:translate(-50%,-50%) rotate(var(--kr,0deg));
    border-radius:50%;
    border:0;padding:0;margin:0;background:transparent;cursor:pointer;outline:none;
  }
  .key::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(ellipse at 50% 35%,rgba(0,0,0,.05),rgba(0,0,0,.55));
    opacity:0;transition:opacity .08s;
  }
  .key::after{
    content:"";position:absolute;inset:-6%;border-radius:50%;
    box-shadow:0 0 0 2px rgba(155,235,170,.9),0 0 12px 2px rgba(130,235,160,.5);
    opacity:0;transition:opacity .18s;
  }
  .key.active::after{opacity:1}
  .key.down::before{opacity:1}
  .key.down{transform:translate(-50%,-47%) rotate(var(--kr,0deg)) scale(.97)}
  .key:focus-visible::after{opacity:1;box-shadow:0 0 0 2px #fff}


  /* scroll key: up arrow = mix +, down arrow = mix - */
  .soft{position:absolute;border:0;padding:0;margin:0;background:transparent;cursor:pointer;outline:none}
  .soft::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity .08s}
  .soft.down::before{opacity:1}
  .mixbar{position:absolute;left:0;right:0;top:74.6%;height:5.1%;display:none;justify-content:center;gap:2.38cqw}
  .mixbar.show{display:flex}
  .mixbar i{display:block;width:5.95cqw;height:100%;background:var(--lcd-ghost)}
  .mixbar i.on{background:var(--lcd-ink)}


  /* audio import bar */
  .bar{display:flex;align-items:center;gap:8px;height:34px;margin:8px 0 2px;padding:0 6px;max-width:calc(100vw - 16px);
    font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.06em;color:#bfe9c8;flex:none}
  .bar button,.bar label{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 12px;border-radius:15px;
    border:1px solid rgba(155,235,170,.38);background:rgba(18,30,24,.78);color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer;
    white-space:nowrap;outline:none;transition:background .15s,border-color .15s}
  .bar button:hover,.bar label:hover{background:rgba(34,58,44,.9);border-color:rgba(155,235,170,.7)}
  .bar button:focus-visible,.bar label:focus-visible{border-color:#fff}
  .bar #play{width:30px;padding:0;font-size:12px;display:none}
  .bar.has #play{display:inline-flex}
  .bar .nm{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.75;display:none}
  .bar.has .nm,.bar.msg .nm{display:block}
  .bar input{display:none}
  body.drag .bar label{background:rgba(60,110,80,.95);border-color:#fff}

  .debug .key{outline:1px solid red}
  .debug .lcd{outline:1px solid cyan}
</style>
</head>
<body>
<div class="bar" id="bar">
  <label id="impLbl" tabindex="0" role="button">&#9835; IMPORTER UN SON<input type="file" id="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg,.flac"></label>
  <button type="button" id="play" aria-label="Lecture / pause">&#9654;</button>
  <span class="nm" id="nm"></span>
</div>
<div class="stage" id="stage">
  <img class="phone" src="phone.webp" alt="BOBAL 3310" decoding="async" fetchpriority="high" onload="document.getElementById('stage').classList.add('ready')">

  <div class="lcd" id="lcd">
    <div class="bars l" id="sig"><b></b><b></b><b></b><b></b></div>
    <div class="bars r" id="bat"><b></b><b></b><b></b><b></b></div>
    <div class="px title">3310</div>
    <canvas id="emo" width="48" height="30"></canvas>
    <div class="mixbar" id="mixbar"></div>
    <div class="px modeName" id="modeName">MODE 1</div>
  </div>

  <div id="keys"></div>
</div>

<script>
(function(){
  // ---- Geometry: phone photo is 430x1000 inside a 490x1060 padded image ----
  var PAD=30, W=490, H=1060;
  function X(v){return ((v+PAD)/W*100)+'%';}
  function Y(v){return ((v+PAD)/H*100)+'%';}
  function SW(v){return (v/W*100)+'%';}
  function SH(v){return (v/H*100)+'%';}

  var lcd=document.getElementById('lcd');
  lcd.style.left=X(64);lcd.style.top=Y(260);lcd.style.width=SW(302);lcd.style.height=SH(212);

  // Measured from the photo: [label, cx, cy, width, height, rotation(deg)]
  var KEYS=[
    ['1',86.7,676.5,80.7,40.9,19.6],['2',213.7,692.3,83.5,42.4,1.2],['3',340.4,677.1,80.7,42.3,-17.1],
    ['4',91.5,747.6,80.6,41.1,19.2],['5',213.7,763.6,83.5,42.2,0.9],['6',335.7,748.0,80.6,42.5,-17.6],
    ['7',96.1,818.8,80.5,41.0,19.9],['8',213.4,835.0,83.4,41.7,0.9],['9',330.9,819.5,80.7,42.1,-17.5],
    ['*',100.3,889.5,80.0,40.5,19.5],['0',213.5,906.2,83.1,41.4,1.2],['#',326.5,890.4,80.6,41.7,-17.6]
  ];
  var MODES={'1':'1 CALL','2':'2 STUTTER','3':'3 AM RADIO','4':'4 LOW BATT','5':'5 WALKIE','6':'6 SCRAMBLE','7':'7 BAD LINE','8':'8 CORRUPT','9':'9 SATELLITE','0':'BYPASS'};
  var ORDER=['1','2','3','4','5','6','7','8','9','0'];

  var keysEl=document.getElementById('keys');
  var nameEl=document.getElementById('modeName');
  var current='1', prev='1', btn={};

  KEYS.forEach(function(k){
    var b=document.createElement('button');
    b.className='key';b.type='button';b.setAttribute('aria-label','Touche '+k[0]);
    b.style.left=X(k[1]);b.style.top=Y(k[2]);b.style.width=SW(k[3]);b.style.height=SH(k[4]);
    b.style.setProperty('--kr',k[5]+'deg');
    b.dataset.k=k[0];
    keysEl.appendChild(b);btn[k[0]]=b;
    var up=function(){b.classList.remove('down');};
    b.addEventListener('pointerdown',function(e){e.preventDefault();press(k[0]);});
    b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
  });

  // ================= Pixel emoji engine (48x30 monochrome) =================
  var cv=document.getElementById('emo'), g=cv.getContext('2d');
  var INK='#1b2a1d';
  function P(x,y){g.fillRect(Math.round(x),Math.round(y),1,1);}
  function R(x,y,w,h){g.fillRect(Math.round(x),Math.round(y),w,h);}
  function L(x0,y0,x1,y1){
    x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
    var dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy;
    for(;;){P(x0,y0);if(x0===x1&&y0===y1)break;var e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}
  }
  // circle outline; pred(dx,dy) filters points (for arcs)
  function C(cx,cy,r,pred){
    var x=r,y=0,err=1-r;
    while(x>=y){
      [[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]].forEach(function(p){
        if(!pred||pred(p[0],p[1]))P(cx+p[0],cy+p[1]);
      });
      y++; if(err<0)err+=2*y+1; else{x--;err+=2*(y-x)+1;}
    }
  }
  function D(cx,cy,r){for(var y=-r;y<=r;y++)for(var x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.6)P(cx+x,cy+y);}
  function face(cx,cy){C(cx,cy,11);C(cx,cy,10);}
  function note(x,y){D(x,y+4,2);L(x+2,y+4,x+2,y);L(x+2,y,x+4,y+1);}
  function heart(x,y,big){
    var s=big?['0110110','1111111','1111111','0111110','0011100','0001000']:['01010','11111','01110','00100'];
    s.forEach(function(row,j){for(var i=0;i<row.length;i++)if(row[i]==='1')P(x+i,y+j);});
  }
  function Zg(x,y,s){L(x,y,x+s,y);L(x+s,y,x,y+s);L(x,y+s,x+s,y+s);}

  var A={};
  // 1 — SING (notes float out)
  A['1']=function(f){
    var m=f%2;
    face(24,16);
    L(17,13,20,11);L(20,11,23,13);L(25,13,28,11);L(28,11,31,13); // happy closed eyes
    D(24,21,m?2:3);
    L(33,18,36,17);L(33,21,37,21);L(33,24,36,25); // sound lines
    var t=f%4;
    note(4+t,18-t*3);note(1+(t+2)%4*2,22-((t+2)%4)*3);
  };
  // 2 — LAUGH
  A['2']=function(f){
    var b=f%2?1:0;
    face(24,16+b);
    L(16,12+b,20,14+b);L(16,16+b,20,14+b);
    L(32,12+b,28,14+b);L(32,16+b,28,14+b);
    for(var y=0;y<5;y++){R(18+Math.floor(y*.6),19+y+b,13-Math.floor(y*1.2),1);}
    if(f%2){P(12,18);P(12,20);P(36,18);P(36,20);}else{P(11,19);P(37,19);}
  };
  // 3 — LOVE
  A['3']=function(f){
    var m=f%2;
    face(24,17);
    heart(15,11,m);heart(28,11,m);
    L(19,22,21,24);L(21,24,27,24);L(27,24,29,22);
    var t=f%4;
    heart(4+t%2*2,22-t*5,false);heart(40-t%2*2,16-t*4+8,false);
  };
  // 4 — SLEEP
  A['4']=function(f){
    face(21,18);
    L(15,15,19,15);L(24,15,28,15);
    if(f%2)D(21,22,1);else{L(19,22,23,22);}
    var t=f%4;
    if(t>=0)Zg(32,18-t,3);
    if(t>=1)Zg(37,11-t,4);
    if(t>=2)Zg(41,4,5);
  };
  // 5 — ANGRY
  A['5']=function(f){
    var s=f%2?1:-1;
    face(24+s,17);
    L(17+s,11,22+s,13);L(31+s,11,26+s,13);
    D(20+s,15,1);D(28+s,15,1);
    L(18+s,23,20+s,21);L(20+s,21,22+s,23);L(22+s,23,24+s,21);L(24+s,21,26+s,23);L(26+s,23,28+s,21);L(28+s,21,30+s,23);
    var t=f%3;
    C(6,8,1+t);C(42,8,1+(t+1)%3);
  };
  // 6 — COOL
  A['6']=function(f){
    var b=f%2?1:0;
    face(24,16+b);
    R(14,12+b,8,4);R(26,12+b,8,4);R(22,12+b,4,1);L(14,12+b,12,11+b);L(34,12+b,36,11+b);
    g.clearRect(15+(f%4)*1,13+b,1,1);
    L(18,21+b,21,23+b);L(21,23+b,27,23+b);L(27,23+b,30,21+b);
    if(f%4===2){P(40,4);P(40,8);P(38,6);P(42,6);P(40,6);}
  };
  // 7 — CRY
  A['7']=function(f){
    face(24,16);
    L(16,11,20,12);L(32,11,28,12);
    D(19,15,1);D(29,15,1);
    L(19,23,21,21);L(21,21,27,21);L(27,21,29,23);
    var t=f%4;
    R(18,17+t*2,1,2);R(30,17+((t+2)%4)*2,1,2);
    if(t<2){P(17,27);P(31,27);}
  };
  // 8 — SKULL
  A['8']=function(f){
    var j=f%2;
    C(24,13,11);C(24,13,10);
    C(24,13,11,function(dx,dy){return dy>2;});
    R(15,13,1,8);R(33,13,1,8);
    D(19,13,3);D(29,13,3);
    P(24,18);P(23,19);P(25,19);
    R(17,21+j,15,6);g.clearRect(18,22+j,13,4);
    for(var x=19;x<=29;x+=2)L(x,22+j,x,25+j);
    L(18,22+j,30,22+j);
    g.clearRect(18,21,13,1+j*0);
  };
  // 9 — SATELLITE
  A['9']=function(f){
    R(20,14,9,9);g.clearRect(21,15,7,7);D(24,18,1);
    R(4,16,14,7);g.clearRect(5,17,12,5);R(9,17,1,5);R(13,17,1,5);
    R(31,16,14,7);g.clearRect(32,17,12,5);R(35,17,1,5);R(39,17,1,5);
    R(18,19,2,1);R(29,19,2,1);
    L(24,14,24,11);L(21,8,24,11);L(27,8,24,11);
    var t=f%3,r=3+t*3;
    C(24,8,r,function(dx,dy){return dy<-1&&dx*dx<(r*r)/2+2;});
    if(f%2){P(6,6);P(41,9);P(10,27);}else{P(42,4);P(5,11);P(38,27);}
  };

  var frame=0;
  function draw(){
    g.clearRect(0,0,48,30);g.fillStyle=INK;
    if(A[current])A[current](frame);
  }
  setInterval(function(){if(current==='0')return;frame++;draw();},260);


  // ---- soft keys: mix down / up (visual only in the preview) ----
  // right-hand key = two-way scroll key: up arrow end raises the mix, down arrow end lowers it
  var SCROLL=[[362,570],[380,573],[391,586],[386,605],[345,648],[295,674],[280,672],[270,640],[269,617],[300,603]];
  var SC=[331,620],SA=[-0.77,0.63];
  function clipHalf(poly,sgn){ // keep the part of the polygon on one side of the key's middle
    var out=[],n=poly.length;
    function f(p){return ((p[0]-SC[0])*SA[0]+(p[1]-SC[1])*SA[1])*sgn;}
    for(var i=0;i<n;i++){var a=poly[i],b=poly[(i+1)%n],fa=f(a),fb=f(b);
      if(fa>=0)out.push(a);
      if((fa>=0)!==(fb>=0)){var t=fa/(fa-fb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}}
    return out;
  }
  var mix=1, mixTimer=null, mixShowing=false;
  var mixbar=document.getElementById('mixbar');
  for(var si=0;si<10;si++){mixbar.appendChild(document.createElement('i'));}
  function showMix(){
    mixShowing=true;
    nameEl.textContent='MIX '+Math.round(mix*100)+'%';
    var lit=Math.round(mix*10);
    Array.prototype.forEach.call(mixbar.children,function(el,i){el.classList.toggle('on',i<lit);});
    mixbar.classList.add('show');
    clearTimeout(mixTimer);
    mixTimer=setTimeout(function(){mixShowing=false;mixbar.classList.remove('show');render();},1800);
  }
  [[-1,'Mix +',+0.1],[1,'Mix -',-0.1]].forEach(function(h){
    var poly=clipHalf(SCROLL,h[0]);
    var xs=poly.map(function(p){return p[0];}),ys=poly.map(function(p){return p[1];});
    var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys);
    var b=document.createElement('button');
    b.className='soft';b.type='button';b.setAttribute('aria-label',h[1]);
    b.style.left=(minx/W*100)+'%';b.style.top=(miny/H*100)+'%';
    b.style.width=((maxx-minx)/W*100)+'%';b.style.height=((maxy-miny)/H*100)+'%';
    b.style.clipPath='polygon('+poly.map(function(p){return ((p[0]-minx)/(maxx-minx)*100)+'% '+((p[1]-miny)/(maxy-miny)*100)+'%';}).join(',')+')';
    keysEl.appendChild(b);
    var up=function(){b.classList.remove('down');};
    b.addEventListener('pointerdown',function(e){
      e.preventDefault();b.classList.add('down');setTimeout(up,110);
      mix=Math.max(0,Math.min(1,Math.round((mix+h[2])*10)/10));
      if(window.N3310Audio)N3310Audio.setMix(mix);
      if(current!=='0')showMix();
    });
    b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
  });

  function setBars(el,n){
    var bs=el.children,len=bs.length;
    for(var i=0;i<len;i++){bs[len-1-i].classList.toggle('off',i>=n);}
  }
  function render(){
    Object.keys(btn).forEach(function(k){btn[k].classList.toggle('active',k===current);});
    lcd.classList.toggle('off',current==='0');
    if(current==='0')return; // bypass: freeze the display, just fade it out
    if(!mixShowing)nameEl.textContent=MODES[current];
    var idx=ORDER.indexOf(current);
    setBars(document.getElementById('sig'),Math.min(4,1+Math.floor(idx/3)));
    setBars(document.getElementById('bat'),4);
    frame=0;draw();
  }
  function press(k){
    var b=btn[k];
    b.classList.add('down');
    setTimeout(function(){b.classList.remove('down');},110);
    if(MODES[k]){
      if(k==='0'){ // bypass: toggle, screen switches off / back on
        if(current==='0'){current=prev;}else{prev=current;current='0';}
      }else{current=k;}
      render();
      if(window.N3310Audio)N3310Audio.setMode(current==='0'?0:+current);
      if(current!=='0')[nameEl,cv].forEach(function(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');});
    }
  }
  window.addEventListener('keydown',function(e){
    if(e.repeat)return;

  // Runs inside the AudioWorklet (stringified) or on the main thread (fallback).
  function makeRunner(bytes,fs){
    var rnd=function(x){return x<0?-Math.round(-x):Math.round(x);};
    var imp={env:{sin:Math.sin,cos:Math.cos,lround:rnd,expf:Math.exp,tanhf:Math.tanh,powf:Math.pow,sinf:Math.sin,
      log1pf:Math.log1p,roundf:rnd,cosf:Math.cos,lroundf:rnd,log2f:Math.log2,exp2f:function(x){return Math.pow(2,x);},
      logf:Math.log,_ZSt20__throw_length_errorPKc:function(){throw new Error('length');}}};
    var inst=new WebAssembly.Instance(new WebAssembly.Module(bytes),imp),e=inst.exports;
    e.init(fs);
    var pl=e.buf_l(),pr=e.buf_r(),buf=null,fl=null,fr=null;
    return {
      setMode:function(m){e.set_mode(m);},
      setMix:function(m){e.set_mix(m);},
      run:function(a,b,oa,ob,n){
        if(buf!==e.memory.buffer){buf=e.memory.buffer;fl=new Float32Array(buf,pl,4096);fr=new Float32Array(buf,pr,4096);}
        fl.set(a);fr.set(b);
        e.process(n);
        for(var i=0;i<n;i++){oa[i]=fl[i];ob[i]=fr[i];}
      }
    };
  }

  var WORKLET_SRC='var makeRunner='+makeRunner.toString()+';\n'+
    'class P extends AudioWorkletProcessor{constructor(){super();this.r=null;this.port.onmessage=function(ev){var m=ev.data;'+
    'if(m.t==="init"){this.r=makeRunner(m.bytes,m.fs);this.r.setMode(m.mode);this.r.setMix(m.mix);}'+
    'else if(this.r){if(m.t==="mode")this.r.setMode(m.v);else if(m.t==="mix")this.r.setMix(m.v);}}.bind(this);}'+
    'process(i,o){var out=o[0];if(!out||!out.length)return true;var inp=i[0],a=inp&&inp[0]?inp[0]:null,b=inp&&inp[1]?inp[1]:a;'+
    'if(!this.r||!a){for(var c=0;c<out.length;c++)out[c].fill(0);return true;}'+
    'this.r.run(a,b,out[0],out[1]||out[0],out[0].length);return true;}}'+
    'registerProcessor("n3310",P);';

  function b64bytes(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}

  var ctx=null,node=null,runner=null,src=null,buffer=null,playing=false,ready=null;
  var bar=document.getElementById('bar'),nm=document.getElementById('nm'),playBtn=document.getElementById('play'),fileIn=document.getElementById('file');
  var impLbl=document.getElementById('impLbl');

  function st(){return window.N3310State?window.N3310State():{mode:1,mix:1};}

  function ensureEngine(){
    if(ready)return ready;
    var AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC();
    var bytes=b64bytes(WASM_B64),s=st();
    ready=(function(){
      if(ctx.audioWorklet&&window.AudioWorkletNode){
        var url=URL.createObjectURL(new Blob([WORKLET_SRC],{type:'application/javascript'}));
        return ctx.audioWorklet.addModule(url).then(function(){
          node=new AudioWorkletNode(ctx,'n3310',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[2],channelCount:2,channelCountMode:'explicit'});
          node.port.postMessage({t:'init',bytes:bytes.buffer.slice(0),fs:ctx.sampleRate,mode:s.mode,mix:s.mix});
          node.connect(ctx.destination);
          api.setMode=function(m){node.port.postMessage({t:'mode',v:m});};
          api.setMix=function(m){node.port.postMessage({t:'mix',v:m});};
        });
      }
      return Promise.reject(new Error('no worklet'));
    })().catch(function(){
      // fallback: same engine on the main thread
      runner=makeRunner(bytes,ctx.sampleRate);
      runner.setMode(s.mode);runner.setMix(s.mix);
      node=ctx.createScriptProcessor(2048,2,2);
      node.onaudioprocess=function(ev){
        var i=ev.inputBuffer,o=ev.outputBuffer,a=i.getChannelData(0),b=i.numberOfChannels>1?i.getChannelData(1):a;
        runner.run(a,b,o.getChannelData(0),o.getChannelData(1),a.length);
      };
      node.connect(ctx.destination);
      api.setMode=function(m){runner.setMode(m);};
      api.setMix=function(m){runner.setMix(m);};
    });
    return ready;
  }

  function setPlaying(p){
    playing=p;
    playBtn.innerHTML=p?'&#10074;&#10074;':'&#9654;';
    playBtn.setAttribute('aria-label',p?'Pause':'Lecture');
  }
  function say(t){nm.textContent=t;bar.classList.add('msg');}

  function startSource(){
    if(src){try{src.stop();}catch(e){}try{src.disconnect();}catch(e){}}
    src=ctx.createBufferSource();src.buffer=buffer;src.loop=true;
    src.connect(node);src.start(0);
  }

  function decode(ab){
    return new Promise(function(res,rej){
      var p=ctx.decodeAudioData(ab,res,rej);
      if(p&&p.then)p.then(res,rej);
    });
  }

  function load(file){
    if(!file)return;
    say('CHARGEMENT...');
    var done=function(){};
    // create/resume the context inside the user gesture
    var eng;
    try{eng=ensureEngine();}catch(e){say('AUDIO INDISPONIBLE');return;}
    var rd=file.arrayBuffer?file.arrayBuffer():new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(f.result);};f.onerror=rej;f.readAsArrayBuffer(file);});
    Promise.all([eng,rd]).then(function(r){return decode(r[1]);}).then(function(b){
      buffer=b;
      return ctx.resume();
    }).then(function(){
      startSource();
      nm.textContent=file.name;bar.classList.remove('msg');bar.classList.add('has');
      setPlaying(true);
    }).catch(function(){say('FICHIER ILLISIBLE');});
  }

  fileIn.addEventListener('change',function(){load(fileIn.files&&fileIn.files[0]);fileIn.value='';});
  impLbl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();fileIn.click();}});

  function toggle(){
    if(!ctx||!buffer)return;
    if(playing){ctx.suspend();setPlaying(false);}else{ctx.resume();setPlaying(true);}
  }
  playBtn.addEventListener('click',toggle);
  window.addEventListener('keydown',function(e){
    if(e.key===' '&&buffer&&document.activeElement===document.body){e.preventDefault();toggle();}
  });

  // drag & drop a file anywhere on the page
  window.addEventListener('dragover',function(e){e.preventDefault();document.body.classList.add('drag');});
  window.addEventListener('dragleave',function(e){if(!e.relatedTarget)document.body.classList.remove('drag');});
  window.addEventListener('drop',function(e){e.preventDefault();document.body.classList.remove('drag');
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)load(f);});

  var api={setMode:function(){},setMix:function(){}};
  window.N3310Audio={setMode:function(m){api.setMode(m);},setMix:function(m){api.setMix(m);}};
})();
</script>
